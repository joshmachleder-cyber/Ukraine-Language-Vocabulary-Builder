<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слова</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A6B">
<style>
  :root {
    --ink:        #16214F;
    --ink-soft:   #5A6486;
    --paper:      #EFEDE7;
    --paper-lift: #F8F7F3;
    --wheat:      #D9A93C;
    --right:      #2C6E52;
    --wrong:      #9B3B32;
    --rule:       rgba(22, 33, 79, 0.16);
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 30rem;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
  }

  /* Progress ticks: one per question in the session */
  .ticks {
    display: flex;
    gap: 3px;
    height: 3px;
    margin: 1rem 0 0;
    flex: 0 0 auto;
  }
  .tick { flex: 1; background: var(--rule); border-radius: 2px; }
  .tick.done { background: var(--ink); }
  .tick.miss { background: var(--wrong); }
  .tick.now  { background: var(--wheat); }

  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-top: 0.6rem;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  /* The word is the hero. Everything else stays quiet. */
  .stage {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem 0;
    min-height: 8rem;
  }

  .word {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.4rem, 13vw, 3.9rem);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 0;
    overflow-wrap: anywhere;
  }

  .pos {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 0.9rem;
    font-style: italic;
  }

  .verdict {
    font-family: var(--serif);
    font-size: 1.05rem;
    margin-top: 1.1rem;
    min-height: 1.6rem;
  }
  .verdict.right { color: var(--right); }
  .verdict.wrong { color: var(--wrong); }

  /* Answers sit low, in thumb reach. */
  .choices { display: grid; gap: 0.5rem; flex: 0 0 auto; }

  .choice {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 1.05rem;
    padding: 0.95rem 1rem;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--paper-lift);
    color: var(--ink);
    cursor: pointer;
  }
  .choice:focus-visible { outline: 2px solid var(--wheat); outline-offset: 2px; }
  .choice[disabled] { cursor: default; }

  .key {
    font-size: 0.7rem;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
    border-radius: 4px;
    min-width: 1.35rem;
    text-align: center;
    padding: 1px 0;
    flex: 0 0 auto;
  }

  .choice.is-right {
    border-color: var(--right);
    box-shadow: inset 3px 0 0 var(--right);
    background: #EAF0EC;
  }
  .choice.is-wrong {
    border-color: var(--wrong);
    box-shadow: inset 3px 0 0 var(--wrong);
    background: #F3E9E7;
  }
  .choice.is-muted { opacity: 0.45; }

  .rate { flex: 0 0 auto; margin-top: 1rem; }
  .rate[hidden] { display: none; }
  .rate-ask {
    text-align: center;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 0.5rem;
  }
  .rate-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .rate-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    font: inherit;
    font-size: 0.9rem;
    padding: 0.8rem 0.5rem;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--paper-lift);
    color: var(--ink);
    cursor: pointer;
  }
  .rate-btn .face { font-size: 1.6rem; line-height: 1; }
  .rate-btn:focus-visible { outline: 2px solid var(--wheat); outline-offset: 2px; }
  .rate-no:hover  { border-color: var(--wrong); }
  .rate-yes:hover { border-color: var(--right); }

  .next {
    margin-top: 0.75rem;
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 0.9rem;
    border: 0;
    border-radius: 10px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }
  .next:focus-visible { outline: 2px solid var(--wheat); outline-offset: 2px; }
  .next[hidden] { display: none; }

  /* End of session */
  .summary { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
  .score {
    font-family: var(--serif);
    font-size: 3.4rem;
    line-height: 1;
    margin: 0 0 0.4rem;
    font-variant-numeric: tabular-nums;
  }
  .score small { font-size: 1.4rem; color: var(--ink-soft); }
  .summary p { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .missed { list-style: none; padding: 0; margin: 0 0 1.5rem; }
  .missed li {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.6rem 0;
    border-top: 1px solid var(--rule);
  }
  .missed .uk { font-family: var(--serif); font-size: 1.15rem; }
  .missed .en { color: var(--ink-soft); text-align: right; }

  .ghost {
    margin-top: 0.5rem;
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 0.9rem;
    border: 1px solid var(--ink);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }

  .coverage { margin: 0 0 1.5rem; }
  .bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ink); }
  .coverage-nums {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--ink-soft); margin-top: 0.4rem;
    font-variant-numeric: tabular-nums;
  }

  .quiet {
    background: none;
    border: 0;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.8rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 0.75rem 0 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .choice, .tick { transition: background-color 120ms ease, opacity 120ms ease; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // The published CSV of the Google Sheet. The app reads it fresh every time
  // it opens, so a word added to the sheet shows up on the next open.
  var SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcnkya4NOgRhpnO_UivuiTA9KdcoTLDbXJn7wELk1PBgXWfOsMSLFqyxeoz3dr7uco6g27rhOQEQKZ/pub?gid=0&single=true&output=csv";

  var SESSION_SIZE = 20;
  var CHOICES = 4;
  var STORE_KEY = "uk-vocab-progress-v1";   // unchanged, so your history carries over
  var LAST_KEY = "uk-vocab-last-session";    // ids shown in the previous session
  var LIST_KEY = "uk-vocab-known-list";      // ids that were on the sheet last time
  var SHEET_CACHE_KEY = "uk-vocab-sheet-cache";

  // When you tap the happy face on a word you got right, it retires.
  // RETIRE_DAYS is how long until it can come back in the review pile.
  var RETIRE_DAYS = 60;

  var app = document.getElementById("app");
  var words = [];
  var addedSinceLastVisit = {};
  var progress = loadJSON(STORE_KEY, {});
  var session = [];
  var mode = "new";
  var index = 0;
  var results = [];
  var answered = false;

  // ---------- storage ----------

  function loadJSON(key, fallback) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
    catch (e) { return fallback; }
  }

  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { /* private browsing, nothing to do */ }
  }

  function saveProgress() { saveJSON(STORE_KEY, progress); }

  // Two signals: whether you picked right, and whether you say you know it.
  function record(word, correct, known) {
    var p = progress[word.id] || { streak: 0, reps: 0, lapses: 0, due: 0 };
    p.reps += 1;
    p.seen = Date.now();

    if (correct && known) {
      p.streak += 1;
      p.known = true;
      p.due = Date.now() + RETIRE_DAYS * 86400000;
    } else {
      // Anything short of "right and I know it" goes in the review pile.
      p.streak = 0;
      p.known = false;
      if (!correct) p.lapses += 1;
      p.due = Date.now();
    }

    progress[word.id] = p;
    saveProgress();
  }

  // ---------- session building ----------

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function tally() {
    var now = Date.now();
    var t = { total: words.length, seen: 0, fresh: 0, review: 0, known: 0 };
    words.forEach(function (w) {
      var p = progress[w.id];
      if (!p) { t.fresh += 1; return; }
      t.seen += 1;
      if (p.known) t.known += 1;
      else if (p.due <= now) t.review += 1;
    });
    return t;
  }

  // Default session: words you have never been quizzed on, drawn at random
  // from the whole sheet, so rows near the bottom get picked as often as rows
  // near the top. Words added to the sheet since your last visit go first.
  // Nothing from the previous session is repeated.
  function buildNewSession() {
    var last = {};
    loadJSON(LAST_KEY, []).forEach(function (id) { last[id] = true; });

    var justAdded = [], unseen = [], seen = [];
    words.forEach(function (w) {
      if (progress[w.id]) { if (!last[w.id]) seen.push(w); }
      else if (addedSinceLastVisit[w.id]) justAdded.push(w);
      else unseen.push(w);
    });

    var picked = shuffle(justAdded).concat(shuffle(unseen)).slice(0, SESSION_SIZE);

    // Once every word on the sheet has been seen, fill with the ones you have
    // gone longest without, still skipping last session's words.
    if (picked.length < SESSION_SIZE) {
      seen.sort(function (a, b) { return progress[a.id].seen - progress[b.id].seen; });
      var oldest = shuffle(seen.slice(0, Math.max(SESSION_SIZE * 3, 60)));
      picked = picked.concat(oldest.slice(0, SESSION_SIZE - picked.length));
    }
    return picked;
  }

  // Review session: only the words you missed or marked "not yet".
  function buildReviewSession() {
    var now = Date.now();
    return shuffle(words.filter(function (w) {
      var p = progress[w.id];
      return p && !p.known && p.due <= now;
    })).slice(0, SESSION_SIZE);
  }

  // Distractors have to be competitive or the question answers itself.
  // Never two options with the same English.
  function distractorsFor(word) {
    var taken = {};
    taken[word.en.toLowerCase()] = true;
    var picked = [];
    var pool = shuffle(words.slice());
    for (var i = 0; i < pool.length && picked.length < CHOICES - 1; i++) {
      var key = pool[i].en.toLowerCase();
      if (pool[i].id === word.id || taken[key]) continue;
      taken[key] = true;
      picked.push(pool[i]);
    }
    return picked;
  }

  // ---------- rendering ----------

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderQuestion() {
    answered = false;
    var word = session[index];
    var options = shuffle(distractorsFor(word).concat([word]));

    app.innerHTML = "";

    var ticks = el("div", "ticks");
    for (var i = 0; i < session.length; i++) {
      var t = el("div", "tick");
      if (i < results.length) t.classList.add(results[i].correct ? "done" : "miss");
      else if (i === index) t.classList.add("now");
      ticks.appendChild(t);
    }
    app.appendChild(ticks);

    var meta = el("div", "meta");
    meta.appendChild(el("span", null, (index + 1) + " of " + session.length + (mode === "review" ? " · review" : "")));
    var p = progress[word.id];
    var tag = p ? "seen " + p.reps + "x" : (addedSinceLastVisit[word.id] ? "just added" : "new word");
    meta.appendChild(el("span", null, tag));
    app.appendChild(meta);

    var stage = el("div", "stage");
    stage.appendChild(el("h1", "word", word.uk));
    var verdict = el("div", "verdict");
    verdict.setAttribute("aria-live", "polite");
    stage.appendChild(verdict);
    app.appendChild(stage);

    var choices = el("div", "choices");
    var buttons = [];
    options.forEach(function (opt, i) {
      var b = el("button", "choice");
      b.appendChild(el("span", "key", String(i + 1)));
      b.appendChild(el("span", null, opt.en));
      choices.appendChild(b);
      buttons.push(b);
    });
    app.appendChild(choices);

    var rate = el("div", "rate");
    rate.hidden = true;
    rate.appendChild(el("div", "rate-ask", "Do you know this word?"));
    var pair = el("div", "rate-pair");
    var no = el("button", "rate-btn rate-no");
    no.innerHTML = '<span class="face">\u{1F641}</span><span>Not yet</span>';
    var yes = el("button", "rate-btn rate-yes");
    yes.innerHTML = '<span class="face">\u{1F642}</span><span>Got it</span>';
    no.addEventListener("click", function () { rated(word, rate.dataset.correct === "1", false); });
    yes.addEventListener("click", function () { rated(word, rate.dataset.correct === "1", true); });
    pair.appendChild(no);
    pair.appendChild(yes);
    rate.appendChild(pair);
    app.appendChild(rate);

    buttons.forEach(function (b, i) {
      b.onclick = function () { answer(options[i], word, buttons, options, verdict, rate, ticks); };
    });

    document.onkeydown = function (e) {
      if (!answered && e.key >= "1" && e.key <= String(options.length)) {
        buttons[Number(e.key) - 1].click();
      } else if (answered) {
        if (e.key === "ArrowLeft" || e.key === "n") { e.preventDefault(); no.click(); }
        if (e.key === "ArrowRight" || e.key === "y" || e.key === "Enter") { e.preventDefault(); yes.click(); }
      }
    };
  }

  function answer(picked, word, buttons, options, verdict, rate, ticks) {
    if (answered) return;
    answered = true;
    var correct = picked.id === word.id;

    buttons.forEach(function (b, i) {
      b.disabled = true;
      if (options[i].id === word.id) b.classList.add("is-right");
      else if (options[i].id === picked.id) b.classList.add("is-wrong");
      else b.classList.add("is-muted");
    });

    verdict.className = "verdict " + (correct ? "right" : "wrong");
    verdict.textContent = correct ? "Correct" : word.uk + " means " + word.en;

    ticks.children[index].className = "tick " + (correct ? "done" : "miss");
    results.push({ word: word, correct: correct });

    rate.hidden = false;
    rate.dataset.correct = correct ? "1" : "";
    rate.querySelector(".rate-yes").focus();
  }

  function rated(word, correct, known) {
    record(word, correct, known);
    results[results.length - 1].known = known;
    index += 1;
    if (index < session.length) renderQuestion();
    else renderSummary();
  }

  function renderSummary() {
    document.onkeydown = null;
    app.innerHTML = "";

    var right = results.filter(function (r) { return r.correct; }).length;
    var missed = results.filter(function (r) { return !r.correct; });

    var wrap = el("div", "summary");
    var score = el("p", "score");
    score.appendChild(document.createTextNode(String(right)));
    score.appendChild(el("small", null, " / " + results.length));
    wrap.appendChild(score);

    var t = tally();
    wrap.appendChild(el("p", null, t.fresh
      ? t.fresh + " " + (t.fresh === 1 ? "word" : "words") + " on your sheet you haven't been quizzed on yet."
      : "You've now seen every word on the sheet. New sessions pick the ones you've gone longest without."));

    var cov = el("div", "coverage");
    var bar = el("div", "bar");
    var fill = el("span");
    fill.style.width = (t.total ? Math.round(100 * t.seen / t.total) : 0) + "%";
    bar.appendChild(fill);
    cov.appendChild(bar);
    var nums = el("div", "coverage-nums");
    nums.appendChild(el("span", null, t.seen + " of " + t.total + " seen"));
    nums.appendChild(el("span", null, t.known + " known · " + t.review + " to review"));
    cov.appendChild(nums);
    wrap.appendChild(cov);

    if (missed.length) {
      var list = el("ul", "missed");
      missed.forEach(function (r) {
        var li = el("li");
        li.appendChild(el("span", "uk", r.word.uk));
        li.appendChild(el("span", "en", r.word.en));
        list.appendChild(li);
      });
      wrap.appendChild(list);
    }

    var again = el("button", "next", t.fresh ? "20 new words" : "20 more words");
    again.addEventListener("click", function () { start("new"); });
    wrap.appendChild(again);

    if (t.review) {
      var rev = el("button", "ghost", "Review " + Math.min(t.review, SESSION_SIZE) + " words I missed");
      rev.addEventListener("click", function () { start("review"); });
      wrap.appendChild(rev);
    }

    var reset = el("button", "quiet", "Reset all progress");
    reset.addEventListener("click", function () {
      if (confirm("Clear every word's review history on this device?")) {
        progress = {};
        saveProgress();
        saveJSON(LAST_KEY, []);
        start("new");
      }
    });
    wrap.appendChild(reset);

    app.appendChild(wrap);
  }

  function renderEmpty(message) {
    app.innerHTML = "";
    var wrap = el("div", "summary");
    wrap.appendChild(el("h1", "word", "No words"));
    wrap.appendChild(el("p", null, message));
    app.appendChild(wrap);
  }

  function start(which) {
    mode = which || "new";
    session = mode === "review" ? buildReviewSession() : buildNewSession();
    index = 0;
    results = [];
    if (!session.length) {
      renderEmpty("Nothing to study. Add some words to the sheet.");
      return;
    }
    saveJSON(LAST_KEY, session.map(function (w) { return w.id; }));
    renderQuestion();
  }

  // ---------- CORE START: reading and cleaning the sheet ----------
  // Same cleanup rules as build_words.py, so word ids (and your progress) match.

  var CYRILLIC = /[Ѐ-ӿ]/;
  var LATIN = /[A-Za-z]/;
  var ERRORS = ["#VALUE!", "#N/A", "#REF!", "#ERROR!", "#NAME?", "#DIV/0!"];
  var EDGE = " -–—.,;:";

  function parseCSV(text) {
    var rows = [], row = [], field = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function cell(row, i) { return row.length > i ? row[i].trim() : ""; }

  function trimChars(s) {
    var a = 0, b = s.length;
    while (a < b && EDGE.indexOf(s[a]) >= 0) a++;
    while (b > a && EDGE.indexOf(s[b - 1]) >= 0) b--;
    return s.slice(a, b);
  }

  function findUkrainian(row) {
    var b = cell(row, 1);
    if (CYRILLIC.test(b)) return b;
    var order = [0, 2, 3, 4];
    for (var k = 0; k < order.length; k++) {
      var v = cell(row, order[k]);
      if (CYRILLIC.test(v)) return v;
    }
    return "";
  }

  function stripGluedEnglish(uk) {
    var m = uk.search(LATIN);
    if (m < 0) return uk;
    var head = uk.slice(0, m), tail = uk.slice(m);
    if (CYRILLIC.test(tail) || !CYRILLIC.test(head)) return uk;
    if (trimChars(head).length < 2) return uk;
    return trimChars(head);
  }

  function normalise(uk) {
    var s = uk.toLowerCase().replace(/ʼ/g, "'").replace(/’/g, "'");
    s = s.replace(/[^Ѐ-ӿ' ]+/g, "");
    return s.replace(/\s+/g, " ").trim();
  }

  function tidyEnglish(en) {
    var parts = en.split(/\s+/).filter(Boolean);
    if (parts.length === 2 && parts[0].toLowerCase().indexOf(parts[1].toLowerCase().slice(0, 4)) === 0) return parts[0];
    return en;
  }

  function cleanRows(rows) {
    var kept = {}, order = [];
    rows.forEach(function (row, n) {
      if (!row.some(function (c) { return c.trim(); })) return;
      var uk = findUkrainian(row);
      var en = cell(row, 2);
      if (!uk || !en) return;
      if (ERRORS.some(function (e) { return en.indexOf(e) >= 0 || uk.indexOf(e) >= 0; })) return;
      if (uk.toLowerCase() === "ukrainian" && en.toLowerCase() === "english") return;
      uk = stripGluedEnglish(uk);
      en = tidyEnglish(en);
      var key = normalise(uk);
      if (!key) return;
      if (kept[key]) {
        if (en.length < kept[key].en.length) kept[key].en = en;
      } else {
        kept[key] = { row: n + 1, uk: uk, en: en };
        order.push(key);
      }
    });
    return order.map(function (k) { return kept[k]; });
  }

  function hex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ("0" + b.toString(16)).slice(-2);
    }).join("");
  }

  function withIds(list) {
    return Promise.all(list.map(function (w) {
      var data = new TextEncoder().encode(w.uk + "|" + w.en);
      return crypto.subtle.digest("SHA-1", data).then(function (h) {
        return { id: hex(h).slice(0, 10), uk: w.uk, en: w.en, row: w.row };
      });
    }));
  }
  // ---------- CORE END ----------

  // ---------- boot ----------

  function loadFromSheet() {
    return fetch(SHEET_CSV + "&t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("sheet returned " + r.status);
        return r.text();
      })
      .then(function (text) {
        if (/^\s*</.test(text)) throw new Error("sheet is not published as CSV");
        return withIds(cleanRows(parseCSV(text)));
      })
      .then(function (list) {
        if (list.length < CHOICES) throw new Error("sheet came back with too few words");
        saveJSON(SHEET_CACHE_KEY, list);
        return list;
      });
  }

  function loadFallback() {
    var cached = loadJSON(SHEET_CACHE_KEY, null);
    if (cached && cached.length >= CHOICES) return Promise.resolve(cached);
    return fetch("words.json", { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("words.json returned " + r.status);
        return r.json();
      })
      .then(function (data) { return data.words || []; });
  }

  // Anything on the sheet today that was not there on the last visit counts
  // as just added, and leads the next new-word session.
  function noteNewArrivals() {
    var before = loadJSON(LIST_KEY, null);
    addedSinceLastVisit = {};
    if (before) {
      var had = {};
      before.forEach(function (id) { had[id] = true; });
      words.forEach(function (w) { if (!had[w.id] && !progress[w.id]) addedSinceLastVisit[w.id] = true; });
    }
    saveJSON(LIST_KEY, words.map(function (w) { return w.id; }));
  }

  loadFromSheet()
    .catch(function (err) {
      if (location.protocol === "file:") throw new Error("Open the app from its GitHub Pages address, not from a file on your computer.");
      return loadFallback();
    })
    .then(function (list) {
      words = list.filter(function (w) { return w.uk && w.en; });
      if (words.length < CHOICES) {
        renderEmpty("You need at least " + CHOICES + " words in the sheet before multiple choice works.");
        return;
      }
      noteNewArrivals();
      start("new");
    })
    .catch(function (err) {
      renderEmpty("Could not load the word list. " + err.message);
    });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () { /* offline is optional */ });
  }
})();
</script>
</body>
</html>
